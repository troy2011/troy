<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TROY Display</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TROY Display" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/display.css" />
    <link rel="stylesheet" href="/css/panel-slice-25.css?v=20260618a" />
  </head>
  <body>
    <div id="audioGate">
      <div id="audioGatePanel">
        <div id="audioGateLabel">店内ディスプレイ開始</div>
        <button id="btnStartDisplay" type="button">音を有効化して全画面表示</button>
        <div id="audioGateHelp">iPadをApple TVへミラーリングしてから、この画面を1回タップしてください</div>
        <div id="audioGateStatus" aria-live="polite"></div>
      </div>
    </div>
    <div id="sea">
      <video
        id="seaVideo"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        controlslist="nodownload noremoteplayback nofullscreen"
        disableremoteplayback
        disablepictureinpicture
        x-webkit-airplay="deny"
        aria-hidden="true"
      >
        <source src="/shipvideo.mp4" type="video/mp4" />
      </video>
      <div id="displayControls">
        <button id="btnUnlockAudio" type="button">音ON</button>
        <button id="btnTestSound" type="button">テスト音</button>
        <button id="btnFullscreen" type="button">全画面</button>
      </div>
      <div id="orderNoticePanel" aria-live="polite" hidden>
        <div class="order-notice-header">
          <div>
            <div class="order-notice-kicker">TROY MENU</div>
            <div class="order-notice-title">注文確認</div>
          </div>
          <div id="orderNoticeCount">0件</div>
        </div>
        <div id="orderNoticeList"></div>
        <div class="order-notice-footer">スタッフ確認中</div>
      </div>
      <div id="effects" aria-live="polite"></div>
      <div id="rankingPanel" aria-live="polite">
        <div id="rankingTitle">店内懸賞金ランキング</div>
        <div id="rankingSub">入店中メンバーのみ</div>
        <ol id="rankingList"></ol>
      </div>
    </div>
    <script type="module">
      import { installPanelSlice25 } from '/js/panelSlice25.js';
      installPanelSlice25();
    </script>
    <script src="/display.js"></script>
  </body>
</html>
