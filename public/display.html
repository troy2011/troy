<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>TROY Display</title>
    <link rel="stylesheet" href="/display.css" />
  </head>
  <body>
    <div id="sea">
      <video id="seaVideo" autoplay muted loop playsinline preload="auto">
        <source src="/shipvideo.mp4" type="video/mp4" />
      </video>
      <div id="seaBase" aria-hidden="true"></div>
      <div id="seaGlow" aria-hidden="true"></div>
      <div id="seaWaves" aria-hidden="true"></div>
      <div id="effects" aria-live="polite"></div>
      <div id="hud">
        <div id="status">LIVE</div>
        <div id="clock"></div>
      </div>
    </div>
    <script src="/display.js"></script>
  </body>
</html>
