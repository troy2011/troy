<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,follow">
    <title>白兵戦デモ</title>
    <link rel="stylesheet" href="./css/melee-demo.css?v=20260801-weapon-motion4">
</head>
<body>
    <main class="melee-root">
        <section class="battle-stage" aria-label="白兵戦デモ">
            <header class="battle-top">
                <div>
                    <h1>白兵戦デモ</h1>
                    <p id="turnText">準備中</p>
                </div>
                <button id="newBattleButton" class="gold-button" type="button">開始</button>
            </header>

            <section class="setup-bar" aria-label="戦闘設定">
                <label>
                    <span>自分</span>
                    <select id="playerWeapon"></select>
                </label>
                <label>
                    <span>相手</span>
                    <select id="enemyWeapon"></select>
                </label>
                <label>
                    <span>デッキ</span>
                    <select id="deckPreset"></select>
                </label>
            </section>

            <section class="fighters melee-replay-board" aria-label="戦闘員">
                <article class="fighter fighter-player melee-replay-combatant" id="playerPanel">
                    <div class="fighter-main">
                        <div>
                            <h2 id="playerName">あなた</h2>
                            <p id="playerMeta">剣型</p>
                        </div>
                    </div>
                    <div id="playerDemoAvatar" class="demo-combat-avatar demo-combat-avatar-player avatar-combat-actor" aria-hidden="true"></div>
                    <div class="hp-line">
                        <span id="playerHpText">HP</span>
                        <meter id="playerHpBar" min="0" max="100" value="100"></meter>
                    </div>
                    <div id="playerStatus" class="status-row"></div>
                    <div id="playerSlots" class="slots melee-replay-slots"></div>
                </article>

                <div class="versus-mark">VS</div>

                <article class="fighter fighter-enemy melee-replay-combatant" id="enemyPanel">
                    <div class="fighter-main">
                        <div>
                            <h2 id="enemyName">甲板長</h2>
                            <p id="enemyMeta">大斧型</p>
                        </div>
                    </div>
                    <div id="enemyDemoAvatar" class="demo-combat-avatar demo-combat-avatar-enemy avatar-combat-actor" aria-hidden="true"></div>
                    <div class="hp-line">
                        <span id="enemyHpText">HP</span>
                        <meter id="enemyHpBar" min="0" max="100" value="100"></meter>
                    </div>
                    <div id="enemyStatus" class="status-row"></div>
                    <div id="enemySlots" class="slots melee-replay-slots"></div>
                </article>
            </section>

            <section class="dice-zone" aria-label="サイコロ">
                <div class="dice-readout">
                    <div id="diceFace" class="dice-face melee-replay-die dice-sprite" aria-label="出目なし">?</div>
                    <div>
                        <div id="actionTitle" class="action-title melee-replay-action-title">開始待ち</div>
                        <div id="actionDetail" class="action-detail melee-replay-action-meta">武器型と小アルカナの出目スロットを確認できます。</div>
                    </div>
                </div>
                <div class="dice-actions">
                    <button id="rollButton" class="roll-button" type="button" disabled>サイコロを振る</button>
                    <div class="fixed-dice" aria-label="出目指定">
                        <button type="button" data-die="1">1</button>
                        <button type="button" data-die="2">2</button>
                        <button type="button" data-die="3">3</button>
                        <button type="button" data-die="4">4</button>
                        <button type="button" data-die="5">5</button>
                        <button type="button" data-die="6">6</button>
                    </div>
                </div>
            </section>

            <section class="deck-editor" aria-label="デッキ編集">
                <label><span>出目2</span><select data-slot="0"></select></label>
                <label><span>出目3</span><select data-slot="1"></select></label>
                <label><span>出目4</span><select data-slot="2"></select></label>
                <label><span>出目5</span><select data-slot="3"></select></label>
                <label><span>出目6</span><select data-slot="4"></select></label>
            </section>

            <section class="battle-log" aria-label="ログ">
                <ol id="battleLog"></ol>
            </section>
        </section>
    </main>
    <script type="module" src="./js/melee-demo.js?v=20260801-weapon-motion4"></script>
</body>
</html>
