<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>略奪戦デモ</title>
    <style>
        :root {
            color-scheme: dark;
            --demo-bg: #050b0f;
            --demo-panel: rgba(6, 18, 22, 0.84);
            --demo-line: rgba(244, 211, 126, 0.36);
            --demo-text: #edf7f4;
            --demo-sub: #9dbab3;
            --demo-accent: #f4d37e;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background:
                linear-gradient(180deg, rgba(5, 11, 15, 0.2), rgba(5, 11, 15, 0.78)),
                url("./Sprites/background/sea.webp") center top / cover fixed no-repeat,
                var(--demo-bg);
            color: var(--demo-text);
            font-family: "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 0;
        }

        body {
            display: grid;
            place-items: start center;
            padding: 18px 12px 28px;
        }

        .demo-shell {
            width: min(720px, 100%);
            border: 1px solid transparent;
            border-image: url("./assets/ui/panels/panel-dark-gold.png") 32 fill / 14px / 0 stretch;
            border-radius: 8px;
            background: var(--demo-panel);
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.46);
            padding: 16px;
        }

        .demo-head {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .demo-title {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
            color: var(--demo-accent);
        }

        .demo-subtitle {
            margin: 5px 0 0;
            color: var(--demo-sub);
            font-size: 12px;
            line-height: 1.4;
        }

        .demo-badge {
            flex: 0 0 auto;
            border: 1px solid rgba(126, 227, 207, 0.42);
            border-radius: 999px;
            color: #9ff5e5;
            background: rgba(4, 25, 28, 0.72);
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 900;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .demo-field {
            display: grid;
            gap: 5px;
        }

        .demo-field label {
            color: var(--demo-sub);
            font-size: 12px;
            font-weight: 800;
        }

        .demo-field select {
            width: 100%;
            min-height: 40px;
            border: 1px solid rgba(88, 122, 113, 0.78);
            border-radius: 8px;
            background: rgba(2, 10, 14, 0.88);
            color: var(--demo-text);
            padding: 0 10px;
            font: inherit;
            font-size: 14px;
        }

        .demo-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .demo-button {
            min-height: 44px;
            border: 1px solid rgba(244, 211, 126, 0.62);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(67, 45, 13, 0.96), rgba(30, 23, 11, 0.96));
            color: #ffe7a7;
            font: inherit;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
        }

        .demo-button.secondary {
            border-color: rgba(126, 227, 207, 0.42);
            background: rgba(5, 24, 28, 0.9);
            color: #baf8ef;
        }

        .demo-log {
            margin-top: 14px;
            min-height: 82px;
            border: 1px solid rgba(84, 118, 111, 0.72);
            border-radius: 8px;
            background: rgba(2, 10, 14, 0.8);
            color: #c5ded8;
            padding: 9px 10px;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .demo-hint {
            margin: 12px 0 0;
            color: #b9c8c3;
            font-size: 12px;
            line-height: 1.6;
        }

        .demo-matrix {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(244, 211, 126, 0.22);
        }

        .demo-section-title {
            margin: 0;
            color: var(--demo-accent);
            font-size: 16px;
            line-height: 1.25;
        }

        .demo-matrix-note {
            margin: 6px 0 12px;
            color: var(--demo-sub);
            font-size: 12px;
            line-height: 1.5;
        }

        .demo-matrix-grid {
            display: grid;
            gap: 12px;
        }

        .demo-matchup-card {
            border: 1px solid rgba(84, 118, 111, 0.72);
            border-radius: 8px;
            background: rgba(2, 10, 14, 0.74);
            overflow: hidden;
        }

        .demo-matchup-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 10px 8px;
            border-bottom: 1px solid rgba(84, 118, 111, 0.42);
        }

        .demo-matchup-title {
            margin: 0;
            font-size: 13px;
            color: #e9f7f2;
        }

        .demo-matchup-summary {
            color: var(--demo-sub);
            font-size: 11px;
            white-space: nowrap;
        }

        .demo-table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .demo-matchup-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            font-size: 11px;
        }

        .demo-matchup-table th,
        .demo-matchup-table td {
            border: 1px solid rgba(84, 118, 111, 0.34);
            padding: 7px;
            vertical-align: top;
        }

        .demo-matchup-table th {
            color: #dbeee8;
            background: rgba(10, 35, 38, 0.78);
            font-weight: 900;
            text-align: left;
        }

        .demo-row-command {
            width: 92px;
            color: #fff0bd;
        }

        .demo-matrix-cell {
            min-width: 120px;
        }

        .demo-cell-result {
            display: inline-flex;
            align-items: center;
            min-height: 20px;
            border-radius: 999px;
            padding: 2px 8px;
            font-weight: 900;
        }

        .demo-matrix-cell.is-win .demo-cell-result {
            color: #d8fff5;
            background: rgba(39, 134, 106, 0.48);
        }

        .demo-matrix-cell.is-loss .demo-cell-result {
            color: #ffe0d4;
            background: rgba(150, 58, 42, 0.54);
        }

        .demo-matrix-cell.is-draw .demo-cell-result {
            color: #dde8e5;
            background: rgba(91, 112, 110, 0.44);
        }

        .demo-cell-detail,
        .demo-row-summary {
            margin-top: 4px;
            color: #b7ccc6;
            line-height: 1.35;
        }

        .demo-row-summary {
            min-width: 118px;
        }

        .demo-verdict {
            display: inline-flex;
            margin-top: 5px;
            border-radius: 999px;
            padding: 2px 7px;
            font-weight: 900;
        }

        .demo-verdict.is-strong {
            color: #2a2206;
            background: #f4d37e;
        }

        .demo-verdict.is-weak {
            color: #ffe7df;
            background: rgba(153, 52, 35, 0.78);
        }

        @media (max-width: 540px) {
            body { padding: 8px; }
            .demo-shell { padding: 13px; }
            .demo-head { align-items: stretch; flex-direction: column; }
            .demo-badge { width: fit-content; }
            .demo-grid,
            .demo-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="demo-shell">
        <header class="demo-head">
            <div>
                <h1 class="demo-title">略奪戦デモ</h1>
                <p class="demo-subtitle">ホームやログインを通さず、略奪海戦だけをテストプレイします。</p>
            </div>
            <div class="demo-badge">DEMO</div>
        </header>

        <section class="demo-grid" aria-label="デモ設定">
            <div class="demo-field">
                <label for="demoPlayerShip">自船</label>
                <select id="demoPlayerShip">
                    <option value="ship_human_fighter" selected>海賊船</option>
                    <option value="ship_elf_fighter">海賊飛空艇</option>
                    <option value="ship_goblin_fighter">ドリルタンク</option>
                    <option value="ship_orc_fighter">水上戦車</option>
                    <option value="ship_human_defender">帆船</option>
                    <option value="ship_elf_defender">海賊飛行船</option>
                    <option value="ship_goblin_defender">潜水艦・望遠鏡</option>
                    <option value="ship_orc_defender">潜水艦</option>
                    <option value="ship_human_merchant">水上馬車</option>
                    <option value="ship_elf_merchant">飛行船</option>
                    <option value="ship_goblin_merchant">水瓶船</option>
                    <option value="ship_orc_merchant">水上バス</option>
                    <option value="ship_human_explorer">帆付きボート</option>
                    <option value="ship_elf_explorer">気球</option>
                    <option value="ship_goblin_explorer">キャタピラ・ボート</option>
                    <option value="ship_orc_explorer">石のボート</option>
                    <option value="boat">手漕ぎボート</option>
                </select>
            </div>
            <div class="demo-field">
                <label for="demoEnemyShip">敵船</label>
                <select id="demoEnemyShip">
                    <option value="ship_human_fighter">海賊船</option>
                    <option value="ship_elf_fighter">海賊飛空艇</option>
                    <option value="ship_goblin_fighter">ドリルタンク</option>
                    <option value="ship_orc_fighter">水上戦車</option>
                    <option value="ship_human_defender" selected>帆船</option>
                    <option value="ship_elf_defender">海賊飛行船</option>
                    <option value="ship_goblin_defender">潜水艦・望遠鏡</option>
                    <option value="ship_orc_defender">潜水艦</option>
                    <option value="ship_human_merchant">水上馬車</option>
                    <option value="ship_elf_merchant">飛行船</option>
                    <option value="ship_goblin_merchant">水瓶船</option>
                    <option value="ship_orc_merchant">水上バス</option>
                    <option value="ship_human_explorer">帆付きボート</option>
                    <option value="ship_elf_explorer">気球</option>
                    <option value="ship_goblin_explorer">キャタピラ・ボート</option>
                    <option value="ship_orc_explorer">石のボート</option>
                    <option value="boat">手漕ぎボート</option>
                </select>
            </div>
            <div class="demo-field">
                <label for="demoPlayerNation">自船属性</label>
                <select id="demoPlayerNation">
                    <option value="fire" selected>火</option>
                    <option value="wind">風</option>
                    <option value="earth">地</option>
                    <option value="water">水</option>
                    <option value="none">無属性</option>
                </select>
            </div>
            <div class="demo-field">
                <label for="demoEnemyNation">敵船属性</label>
                <select id="demoEnemyNation">
                    <option value="fire">火</option>
                    <option value="wind" selected>風</option>
                    <option value="earth">地</option>
                    <option value="water">水</option>
                    <option value="none">無属性</option>
                </select>
            </div>
            <div class="demo-field">
                <label for="demoEnemyPlan">敵AI</label>
                <select id="demoEnemyPlan">
                    <option value="突撃型">突撃型</option>
                    <option value="砲撃型" selected>砲撃型</option>
                    <option value="攪乱型">攪乱型</option>
                </select>
            </div>
            <div class="demo-field">
                <label for="demoArcanaPreset">大アルカナ艤装</label>
                <select id="demoArcanaPreset">
                    <option value="none" selected>なし</option>
                    <option value="attack">攻撃テスト</option>
                    <option value="guard">防御テスト</option>
                    <option value="mixed">複合テスト</option>
                </select>
            </div>
        </section>

        <div class="demo-actions">
            <button id="demoStart" class="demo-button" type="button">略奪戦を開始</button>
            <button id="demoQuick" class="demo-button secondary" type="button">標準設定で再戦</button>
        </div>

        <div id="demoLog" class="demo-log" aria-live="polite">デモ待機中。</div>
        <p class="demo-hint">接舷時は白兵戦へ進まず、デモログに結果だけ表示します。戦利品や修理費はデモ用の仮計算です。</p>

        <section class="demo-matrix" aria-labelledby="demoMatrixTitle">
            <h2 id="demoMatrixTitle" class="demo-section-title">コマンド相性</h2>
            <p id="demoMatrixNote" class="demo-matrix-note">基本ルールを読み込み中。</p>
            <div id="demoCommandMatrix" class="demo-matrix-grid"></div>
        </section>
    </main>

    <script src="./naval-battle.js"></script>
    <script>
        (() => {
            'use strict';

            const shipOptions = {
                boat: { form: 'boat', race: '', name: '手漕ぎボート' },
                ship_human_fighter: { form: 'fighter', race: 'human', name: '海賊船' },
                ship_elf_fighter: { form: 'fighter', race: 'elf', name: '海賊飛空艇' },
                ship_goblin_fighter: { form: 'fighter', race: 'goblin', name: 'ドリルタンク' },
                ship_orc_fighter: { form: 'fighter', race: 'orc', name: '水上戦車' },
                ship_human_defender: { form: 'defender', race: 'human', name: '帆船' },
                ship_elf_defender: { form: 'defender', race: 'elf', name: '海賊飛行船' },
                ship_goblin_defender: { form: 'defender', race: 'goblin', name: '潜水艦・望遠鏡' },
                ship_orc_defender: { form: 'defender', race: 'orc', name: '潜水艦' },
                ship_human_merchant: { form: 'merchant', race: 'human', name: '水上馬車' },
                ship_elf_merchant: { form: 'merchant', race: 'elf', name: '飛行船' },
                ship_goblin_merchant: { form: 'merchant', race: 'goblin', name: '水瓶船' },
                ship_orc_merchant: { form: 'merchant', race: 'orc', name: '水上バス' },
                ship_human_explorer: { form: 'explorer', race: 'human', name: '帆付きボート' },
                ship_elf_explorer: { form: 'explorer', race: 'elf', name: '気球' },
                ship_goblin_explorer: { form: 'explorer', race: 'goblin', name: 'キャタピラ・ボート' },
                ship_orc_explorer: { form: 'explorer', race: 'orc', name: '石のボート' }
            };

            const arcanaPresets = {
                none: [],
                attack: ['arcana-4', 'arcana-7', 'arcana-19'],
                guard: ['arcana-0', 'arcana-5', 'arcana-20'],
                mixed: ['arcana-2', 'arcana-11', 'arcana-16']
            };

            const logEl = document.getElementById('demoLog');
            const byId = (id) => document.getElementById(id);
            const valueOf = (id) => byId(id)?.value || '';

            function escapeText(value) {
                return String(value ?? '').replace(/[&<>"']/g, (char) => (
                    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]
                ));
            }

            function formatMatrixValue(value) {
                const number = Number(value) || 0;
                const rounded = Math.round(number * 10) / 10;
                const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
                return rounded > 0 ? `+${text}` : text;
            }

            function matrixOutcomeLabel(outcome) {
                if (outcome === 'win') return '勝ち';
                if (outcome === 'loss') return '負け';
                return 'あいこ';
            }

            function renderMatrixCell(cell) {
                const dodgeText = cell.playerDodgedShot
                    ? '<div class="demo-cell-detail">回避勝ち</div>'
                    : (cell.enemyDodgedShot ? '<div class="demo-cell-detail">回避される</div>' : '');
                const cooldowns = [];
                if (cell.playerRudderCooldown) cooldowns.push('自船操舵不可');
                if (cell.enemyRudderCooldown) cooldowns.push('敵船操舵不可');
                const cooldownText = cooldowns.length
                    ? `<div class="demo-cell-detail">次手: ${escapeText(cooldowns.join(' / '))}</div>`
                    : '';
                return `
                    <td class="demo-matrix-cell is-${escapeText(cell.outcome)}"
                        data-matrix-cell
                        data-player-command="${escapeText(cell.playerCommandId)}"
                        data-enemy-command="${escapeText(cell.enemyCommandId)}"
                        data-outcome="${escapeText(cell.outcome)}">
                        <span class="demo-cell-result">${matrixOutcomeLabel(cell.outcome)}</span>
                        <div class="demo-cell-detail">負荷差 ${formatMatrixValue(cell.score)}</div>
                        <div class="demo-cell-detail">次: ${escapeText(cell.nextPlayerFacingLabel)} / ${escapeText(cell.nextEnemyFacingLabel)}</div>
                        ${cooldownText}
                        ${dodgeText}
                    </td>
                `;
            }

            function renderCommandMatrix() {
                const matrixEl = byId('demoCommandMatrix');
                const noteEl = byId('demoMatrixNote');
                const matrix = window.__navalBattleDebug?.getCommandMatrix?.();
                if (!matrixEl || !noteEl || !matrix?.states?.length) {
                    if (noteEl) noteEl.textContent = '相性表を読み込めませんでした。';
                    return;
                }
                noteEl.textContent = matrix.note || '基本ルールのみ。';
                matrixEl.innerHTML = matrix.states.map((state) => `
                    <article class="demo-matchup-card" data-command-matrix-state="${escapeText(state.id)}">
                        <div class="demo-matchup-head">
                            <h3 class="demo-matchup-title">${escapeText(state.label)}</h3>
                            <div class="demo-matchup-summary">自船 ${escapeText(state.playerFacingLabel)} / 敵 ${escapeText(state.enemyFacingLabel)}</div>
                        </div>
                        <div class="demo-table-scroll">
                            <table class="demo-matchup-table">
                                <thead>
                                    <tr>
                                        <th scope="col">自船＼敵船</th>
                                        ${state.enemyCommands.map((command) => `<th scope="col">${escapeText(command.label)}</th>`).join('')}
                                        <th scope="col">行評価</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.rows.map((row) => `
                                        <tr>
                                            <th class="demo-row-command" scope="row">${escapeText(row.label)}</th>
                                            ${row.cells.map(renderMatrixCell).join('')}
                                            <td class="demo-row-summary" data-row-summary>
                                                平均 ${formatMatrixValue(row.summary.averageScore)}<br>
                                                最悪 ${formatMatrixValue(row.summary.worstScore)}
                                                ${row.summary.verdictLabel ? `<span class="demo-verdict is-${escapeText(row.summary.verdict)}">${escapeText(row.summary.verdictLabel)}</span>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </article>
                `).join('');
            }

            function log(message) {
                const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                logEl.textContent = `[${time}] ${message}`;
            }

            function shipProfile(itemId, arcanaItemIds = []) {
                const option = shipOptions[itemId] || shipOptions.boat;
                return {
                    form: option.form,
                    shipClass: option.form,
                    itemId: itemId === 'boat' ? 'ship_common_boat' : itemId,
                    name: option.name,
                    level: 3,
                    majorArcanaItemIds: arcanaItemIds,
                    cargoResources: {
                        香辛料: 8,
                        火薬樽: 4,
                        金貨袋: 6
                    }
                };
            }

            function playerProfile(nation) {
                return {
                    nation,
                    level: 12,
                    stats: {
                        attack: 18,
                        defense: 14,
                        speed: 10
                    }
                };
            }

            function rewardProfile(nation) {
                return {
                    nation,
                    chips: 360,
                    explorationCandidates: ['近海の漂流箱', '珊瑚礁の小島', '古い灯台']
                };
            }

            function callbackLabel(result) {
                if (!result) return '結果なし';
                if (result.label) return result.label;
                if (result.navalOutcome === 'boarding') return '接舷成功';
                if (result.navalOutcome === 'boarded') return '接舷された';
                return result.outcome || '完了';
            }

            function startDemoBattle({ standard = false } = {}) {
                if (standard) {
                    byId('demoPlayerShip').value = 'ship_human_fighter';
                    byId('demoEnemyShip').value = 'ship_human_defender';
                    byId('demoPlayerNation').value = 'fire';
                    byId('demoEnemyNation').value = 'wind';
                    byId('demoEnemyPlan').value = '砲撃型';
                    byId('demoArcanaPreset').value = 'none';
                }

                const playerShip = valueOf('demoPlayerShip') || 'ship_human_fighter';
                const enemyShip = valueOf('demoEnemyShip') || 'ship_human_defender';
                const preset = valueOf('demoArcanaPreset') || 'none';
                const playerArcana = arcanaPresets[preset] || [];
                const enemyArcana = preset === 'mixed' ? ['arcana-5', 'arcana-12'] : [];

                window.startNavalBattle({
                    playerId: 'DEMO_PLAYER',
                    opponentId: 'DEMO_OPPONENT',
                    playerName: 'デモ船長',
                    opponentName: '訓練相手',
                    enemyPlan: valueOf('demoEnemyPlan') || '砲撃型',
                    playerProfile: playerProfile(valueOf('demoPlayerNation') || 'fire'),
                    opponentProfile: rewardProfile(valueOf('demoEnemyNation') || 'wind'),
                    playerShipProfile: shipProfile(playerShip, playerArcana),
                    opponentShipProfile: shipProfile(enemyShip, enemyArcana),
                    onBoarding: (_opponentId, result) => log(`${callbackLabel(result)}。白兵戦デモへは進まず終了。`),
                    onCargoRaid: (_opponentId, result) => log(`${callbackLabel(result)}。チップ${result?.chips ?? 0}候補。`),
                    onEnemyCargoRaid: (_opponentId, result) => log(`${callbackLabel(result)}。${result?.note || ''}`),
                    onVictory: (_opponentId, result) => log(`${callbackLabel(result)}。チップ${result?.chips ?? 0}候補。`),
                    onDefeat: (_opponentId, result) => log(`${callbackLabel(result)}。${result?.note || ''}`),
                    onStandoff: (_opponentId, result) => log(`${callbackLabel(result)}。${result?.note || ''}`)
                });

                log(`${shipOptions[playerShip]?.name || '船'} vs ${shipOptions[enemyShip]?.name || '船'} を開始。`);
            }

            byId('demoStart').addEventListener('click', () => startDemoBattle());
            byId('demoQuick').addEventListener('click', () => startDemoBattle({ standard: true }));

            if (typeof window.startNavalBattle !== 'function') {
                log('naval-battle.js の読み込みに失敗しました。');
                return;
            }

            renderCommandMatrix();
            log('自船と敵船を選んで「略奪戦を開始」を押してください。');
