<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,follow">
    <title>Tarot Kingdom Preview</title>
    <link rel="stylesheet" href="./style.css?v=20260813-tutorial-flow-v1">
    <link rel="stylesheet" href="./tarot-kingdom-summons.css?v=20260813-tutorial-flow-v1">
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(125, 97, 176, 0.18), transparent 36%),
                linear-gradient(180deg, #0b0e16 0%, #060810 100%);
            color: #f8f0de;
            font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 12px;
            box-sizing: border-box;
        }

        #tarotKingdomRoot {
            display: block !important;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "phaser": "./js/vendor/phaser.esm.js",
                "geofire-common": "/vendor/geofire-common/index.esm.js",
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
                "firebase/database": "./js/vendor/firebase-database-preview.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
                "config": "./js/config.js",
                "api": "./js/api.js",
                "ui": "./js/ui.js?v=20260813-tutorial-flow-v1",
                "avatar": "./js/avatar.js",
                "player": "./js/player.js",
                "inventory": "./js/inventory.js?v=20260811-resonance-per-card1",
                "game": "./Game.js"
            }
        }
    </script>
</head>
<body class="tarot-kingdom-preview-body">
    <div id="tarotKingdomRoot" class="content-area tarot-kingdom-root tarot-kingdom-jrpg tarot-kingdom-reference-ui tarot-kingdom-reference-v2">
        <div class="tarot-kingdom-header">
            <div class="tarot-kingdom-title-wrap">
                <div class="tarot-kingdom-title-copy">
                    <span class="tarot-kingdom-title-kicker">MONSTER CARD BATTLE</span>
                    <h2>タロットキングダム</h2>
                </div>
            </div>
            <div class="tarot-kingdom-header-meta">
                <span id="tarotKingdomRound" class="tarot-kingdom-chip">Round 0 / 4</span>
            </div>
        </div>
        <div id="tarotKingdomEffectOverlay" class="tarot-effect-overlay" aria-hidden="true"></div>
        <div id="tarotKingdomCutin" class="tarot-cutin" aria-hidden="true"></div>
        <div id="tarotKingdomStateText" class="tarot-state-text">オンラインかオフラインを選択してください。</div>
        <div id="tarotKingdomOpenRooms" class="tarot-kingdom-openrooms" hidden>
            <div class="tarot-kingdom-openrooms-title">対戦相手受付中</div>
            <div id="tarotKingdomOpenRoomsList" class="tarot-kingdom-openrooms-list">募集中の部屋はありません。</div>
        </div>
        <div id="tarotKingdomModeControls" class="tarot-kingdom-controls">
            <button id="tarotKingdomStartOnlineButton" type="button">オンライン対戦を探す</button>
            <button id="tarotKingdomStartOfflineButton" type="button" class="is-offline-alt">オフラインで始める</button>
            <button id="tarotKingdomRetreatButton" type="button" class="is-retreat" hidden>撤退</button>
            <button id="tarotKingdomRestartButton" type="button" hidden>もう一度遊ぶ</button>
        </div>
        <main class="tarot-kingdom-combat-screen">
        <section id="tarotKingdomBattleStage" class="tarot-kingdom-battle-stage" aria-label="モンスターバトル" hidden>
            <div class="tarot-kingdom-battle-arena tarot-kingdom-battle-arena--moonlit">
                <label class="tarot-kingdom-demo-enemy-picker" for="tarotKingdomDemoEnemySelect">
                    <span>DEMO ENEMY</span>
                    <select id="tarotKingdomDemoEnemySelect" aria-label="デモの敵を選択"></select>
                </label>
                <label class="tarot-kingdom-demo-battlefield-picker" for="tarotKingdomDemoBattlefieldSelect">
                    <span>DEMO FIELD</span>
                    <select id="tarotKingdomDemoBattlefieldSelect" aria-label="デモの戦闘背景を選択"></select>
                </label>
                <label class="tarot-kingdom-demo-pet-picker" for="tarotKingdomDemoPetSelect">
                    <span>DEMO PET</span>
                    <select id="tarotKingdomDemoPetSelect" aria-label="デモのペットを選択"></select>
                </label>
                <label class="tarot-kingdom-demo-field-scene-picker" for="tarotKingdomDemoFieldSceneSelect">
                    <span>DEMO FIELD EFFECT</span>
                    <select id="tarotKingdomDemoFieldSceneSelect" aria-label="デモの場札背景を選択"></select>
                </label>
                <label class="tarot-kingdom-demo-role-picker" for="tarotKingdomDemoRoleSelect">
                    <span>DEMO 5-CARD ROLE</span>
                    <select id="tarotKingdomDemoRoleSelect" aria-label="デモの5枚役演出を選択"></select>
                </label>
                <label class="tarot-kingdom-demo-chain-picker" for="tarotKingdomDemoChainSelect">
                    <span>DEMO CHAIN</span>
                    <select id="tarotKingdomDemoChainSelect" aria-label="デモのチェイン数を選択"></select>
                </label>
                <label class="tarot-kingdom-demo-status-target-picker" for="tarotKingdomDemoStatusTargetSelect">
                    <span>DEMO STATUS TARGET</span>
                    <select id="tarotKingdomDemoStatusTargetSelect" aria-label="状態効果の表示対象を選択">
                        <option value="enemy">敵</option>
                        <option value="player-0">味方1</option>
                        <option value="player-1">味方2</option>
                        <option value="player-2">味方3</option>
                        <option value="player-3">味方4</option>
                    </select>
                </label>
                <label class="tarot-kingdom-demo-status-picker" for="tarotKingdomDemoStatusSelect">
                    <span>DEMO EFFECT</span>
                    <select id="tarotKingdomDemoStatusSelect" aria-label="表示する状態効果を選択"></select>
                </label>
                <label class="tarot-kingdom-demo-summon-picker" for="tarotKingdomDemoSummonSelect">
                    <span>DEMO SUMMON</span>
                    <select id="tarotKingdomDemoSummonSelect" aria-label="デモの召喚獣を選択"></select>
                </label>
                <section class="tarot-kingdom-battle-enemy is-facing-left" aria-label="敵モンスター">
                    <div class="tarot-kingdom-battle-side-heading">
                        <span class="tarot-kingdom-battle-eyebrow">ENEMY</span>
                        <strong id="tarotKingdomEnemyName">モンスター</strong>
                    </div>
                    <div class="tarot-kingdom-battle-hp" role="progressbar" aria-label="敵のHP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                        <div class="tarot-kingdom-battle-hp-label">
                            <span>HP</span>
                            <span id="tarotKingdomEnemyHpText">100 / 100</span>
                        </div>
                        <div class="tarot-kingdom-battle-hp-track">
                            <span id="tarotKingdomEnemyHpFill" class="tarot-kingdom-battle-hp-fill"></span>
                        </div>
                    </div>
                    <div class="tarot-kingdom-battle-status-tray is-enemy" data-status-target="enemy" aria-label="敵の状態効果"></div>
                    <div class="tarot-kingdom-battle-enemy-visual">
                        <div id="tarotKingdomEnemySprite" class="tarot-kingdom-battle-enemy-sprite" data-facing="left" role="img" aria-label="敵モンスター">
                            <div class="tarot-kingdom-status-accent is-enemy" aria-hidden="true"></div>
                            <div class="tarot-kingdom-shield-ring is-enemy" aria-hidden="true" hidden></div>
                        </div>
                        <span class="tarot-kingdom-enemy-skip-soak" aria-hidden="true"></span>
                    </div>
                </section>
                <div class="tarot-kingdom-battle-center">
                    <div class="tarot-kingdom-battle-turn">
                        <span class="tarot-kingdom-battle-cursor" aria-hidden="true">▶</span>
                        <span>BATTLE LOG</span>
                    </div>
                    <div id="tarotKingdomBattleFeed" class="tarot-kingdom-battle-feed" role="status" aria-live="polite" aria-atomic="true">
                        <div class="tarot-kingdom-battle-event is-info">バトル開始を待っています</div>
                    </div>
                </div>
                <section class="tarot-kingdom-battle-party-side" aria-label="味方パーティー">
                    <div class="tarot-kingdom-battle-side-heading">
                        <span class="tarot-kingdom-battle-eyebrow">PARTY</span>
                        <strong>冒険者</strong>
                    </div>
                    <div id="tarotKingdomBattleParty" class="tarot-kingdom-battle-party"></div>
                </section>
            </div>
        </section>
        <div class="tarot-kingdom-layout">
            <div class="tarot-kingdom-panel tarot-kingdom-panel--trick">
                <div class="tarot-kingdom-panel-title tarot-kingdom-trick-title">
                    <span class="tarot-kingdom-panel-heading"><span class="tarot-kingdom-panel-eyebrow">FIELD</span><span>場札</span></span>
                    <div class="tarot-kingdom-trick-status">
                        <span id="tarotKingdomTrickOwner" class="tarot-kingdom-chip tarot-kingdom-chip--owner">場札主: -</span>
                        <span id="tarotKingdomRoleChain" class="tarot-kingdom-chip tarot-kingdom-chip--chain" hidden>2 CHAIN</span>
                        <span id="tarotKingdomReverse" class="tarot-kingdom-chip tarot-kingdom-chip--reverse" hidden>11バック中</span>
                        <span id="tarotKingdomLock" class="tarot-kingdom-chip tarot-kingdom-chip--lock" hidden>ロック中</span>
                        <span id="tarotKingdomTurn" class="tarot-kingdom-chip tarot-kingdom-chip--turn">手番: -</span>
                        <span id="tarotKingdomScore" class="tarot-kingdom-chip tarot-kingdom-chip--score">ラウンド 0-0-0-0</span>
                    </div>
                </div>
                <div class="tarot-kingdom-card-stage" aria-label="大型カード5枚の戦闘領域">
                    <div id="tarotKingdomTrick" class="tarot-kingdom-trick tarot-card-row" aria-label="場札5枠"></div>
                </div>
                <div id="tarotKingdomJudgmentArea" class="tarot-kingdom-judgment" style="display:none;">
                    <div id="tarotKingdomJudgmentTitle" class="tarot-kingdom-judgment-title">墓地</div>
                    <button id="tarotKingdomJudgmentCloseButton" class="tarot-kingdom-judgment-close ui-modal-close" type="button" aria-label="墓地を閉じる"></button>
                    <div id="tarotKingdomJudgmentOptions" class="tarot-kingdom-judgment-options"></div>
                    <button id="tarotKingdomJudgmentSkipButton" type="button">回収しない</button>
                </div>
            </div>
            <div class="tarot-kingdom-panel tarot-kingdom-panel--hand">
                <div class="tarot-kingdom-panel-title tarot-kingdom-hand-title">
                    <span class="tarot-kingdom-panel-heading"><span class="tarot-kingdom-panel-eyebrow">HAND</span><span>あなたの手札</span><span id="tarotKingdomHandCount" class="tarot-kingdom-hand-count">0</span></span>
                    <div class="tarot-kingdom-hand-actions">
                        <span id="tarotKingdomYourTurnBadge" class="tarot-kingdom-your-turn-badge" hidden>YOUR TURN</span>
                    </div>
                </div>
                <div id="tarotKingdomArcanaNav" class="tarot-kingdom-arcana-nav" aria-label="守護アルカナ" hidden>
                    <div id="tarotKingdomGuardianPassive" class="tarot-kingdom-guardian-passive" hidden>
                        <span id="tarotKingdomGuardianPassiveLabel" class="tarot-kingdom-guardian-passive-label">守護</span>
                        <strong id="tarotKingdomGuardianPassiveName"></strong>
                        <span id="tarotKingdomGuardianPassiveText"></span>
                    </div>
                </div>
                <div id="tarotKingdomSelectedEffect" class="tarot-kingdom-selected-effect" role="status" aria-live="polite">
                    <span id="tarotKingdomSelectedEffectText" class="tarot-kingdom-selected-effect-text">戦闘状況を確認中</span>
                </div>
                <div id="tarotKingdomHand" class="tarot-kingdom-hand tarot-card-row"></div>
                <div id="tarotKingdomActionPopup" class="tarot-bet-popup tarot-kingdom-action-popup app-action-panel">
                    <div class="tarot-betting-actions">
                        <button id="tarotKingdomGraveToggleButton" class="tarot-kingdom-command-grave" type="button" aria-label="墓地を見る"><span aria-hidden="true">☰</span><span class="tarot-kingdom-battle-menu-label">墓地を見る</span></button>
                        <button id="tarotKingdomClearButton" class="tarot-kingdom-clear-inline" type="button">選択解除</button>
                        <button id="tarotKingdomFoldButton" type="button">防御</button>
                        <button id="tarotKingdomPlayButton" class="tarot-kingdom-play-inline is-defense" type="button">パス</button>
                    </div>
                </div>
            </div>
            <div class="tarot-kingdom-panel tarot-kingdom-panel--players">
                <div class="tarot-kingdom-panel-title tarot-kingdom-panel-title--actions">
                    <span class="tarot-kingdom-panel-heading"><span class="tarot-kingdom-panel-eyebrow">STATUS</span><span>プレイヤー情報</span></span>
                    <div class="tarot-kingdom-player-actions">
                        <button id="tarotKingdomSettlementConfirmButton" type="button" hidden>次の局へ</button>
                    </div>
                </div>
                <div id="tarotKingdomPlayers" class="tarot-kingdom-players"></div>
            </div>
        </div>
        </main>
        <div id="tarotKingdomLog" class="tarot-log tarot-log--kingdom"></div>
    </div>
    <script type="module">
        window.myPlayFabId = 'preview-player';
        window.myPlayFabDisplayName = 'Preview';
        window.myLineProfile = { displayName: 'Preview' };
        window.__TAROT_KINGDOM_PREVIEW__ = true;

        import { loadTarotKingdomPage, destroyTarotKingdomPage } from './js/tarotKingdom.js?v=20260813-tutorial-flow-v1';

        window.TarotKingdomPreview = {
            load: () => loadTarotKingdomPage(),
            destroy: () => destroyTarotKingdomPage()
        };

        loadTarotKingdomPage()
            .then(() => {
                const fixture = new URLSearchParams(window.location.search).get('tkfixture');
                const showcase = new URLSearchParams(window.location.search).get('tkshowcase');
                const debug = window.TarotKingdomDebug;
                if (showcase === 'resonance') {
                    debug?.battleScenario({
                        withTrick: false,
                        turnIndex: 0,
                        enableNpcSeats: true,
                        handsBySeat: [[
                            { id: 'showcase-sword-5', kind: 'minor', suit: 'Sword', number: 5 },
                            { id: 'showcase-cup-5', kind: 'minor', suit: 'Cup', number: 5 },
                            { id: 'showcase-wand-5', kind: 'minor', suit: 'Wand', number: 5 },
                            { id: 'showcase-major-5', kind: 'major', suit: 'None', number: 5 },
                            { id: 'showcase-cup-3', kind: 'minor', suit: 'Cup', number: 3 },
                            { id: 'showcase-pentacle-8', kind: 'minor', suit: 'Pentacle', number: 8 },
                            { id: 'showcase-wand-10', kind: 'minor', suit: 'Wand', number: 10 },
                            { id: 'showcase-sword-7', kind: 'minor', suit: 'Sword', number: 7 }
                        ]],
                        charactersBySeat: [{
                            version: 4,
                            tarotDeck: [
                                { slot: 0, itemId: 'tarot_minor_sword_05', suit: 'Sword', rank: 5, cardLevel: 1, resonanceId: 'sword-5' },
                                { slot: 1, itemId: 'tarot_minor_cup_05', suit: 'Cup', rank: 5, cardLevel: 1, resonanceId: 'cup-5' },
                                { slot: 2, itemId: 'tarot_minor_cup_03', suit: 'Cup', rank: 3, cardLevel: 1, resonanceId: 'cup-3' },
                                { slot: 3, itemId: 'tarot_minor_pentacle_08', suit: 'Pentacle', rank: 8, cardLevel: 1, resonanceId: 'pentacle-8' },
                                { slot: 4, itemId: 'tarot_minor_wand_10', suit: 'Wand', rank: 10, cardLevel: 1, resonanceId: 'wand-10' }
                            ],
                            guardianArcana: {
                                itemId: 'tarot_major_05',
                                number: 5,
                                cardLevel: 1,
                                passiveId: 'guardian-v3-5'
                            }
                        }]
                    });
                    return;
                }
                if (fixture === 'skip-soak') {
                    debug?.battleScenario({ withTrick: true });
                    debug?.battleSetEnemyAreaSeal(true);
                    return;
                }
                if (fixture !== 'raid-transform') return;
                debug?.battleScenario({
                    withTrick: false,
                    enemyHp: 0,
                    raid: {
                        attemptId: 'raid-transform-preview',
                        raidId: 'raid-preview',
                        bossId: 'ismartal-vol2-monster-07',
                        bossName: 'バルガン',
                        preFormMonsterId: 'ismartal-vol3-monster-01',
                        preFormMonsterName: 'グラヴァ',
                        bossMaxHp: 250000,
                        bossHpAtStart: 184200
                    }
                });
                debug?.battleActivateRaidBoss(0);
            })
            .catch((error) => {
                console.error('[tarot-kingdom-preview] failed to load:', error);
            });
    </script>
</body>
</html>
