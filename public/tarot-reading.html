<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#151315">
    <link rel="icon" type="image/png" href="/Sprites/PirateIcon/Icon1.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/tarot-reading.css">
    <title>TROY タロット鑑定</title>
</head>
<body class="tarot-reading-body">
    <main id="tarotReadingApp" class="tarot-reading-shell">
        <header class="tarot-reading-header">
            <div class="tarot-reading-brand">
                <div class="tarot-reading-brand-mark" aria-hidden="true"></div>
                <div>
                    <div class="tarot-reading-kicker">TROY STAFF TAROT</div>
                    <h1>タロット航路</h1>
                </div>
            </div>
            <div id="tarotReadingStatus" class="tarot-reading-status" role="status" aria-live="polite">待機中</div>
        </header>

        <section class="tarot-reading-board" aria-label="タロット鑑定入力">
            <div class="tarot-reading-side-controls">
                <section class="tarot-reading-panel tarot-reading-customer">
                    <div class="tarot-reading-section-head">
                        <div>
                            <div class="tarot-reading-section-title">送信先</div>
                            <div class="tarot-reading-section-sub">現在の店内リスト</div>
                        </div>
                        <button id="tarotRefreshCustomers" type="button" class="tarot-reading-icon-button" title="店内リストを更新" aria-label="店内リストを更新">↻</button>
                    </div>
                    <label class="tarot-reading-field">
                        <span>お客様</span>
                        <select id="tarotCustomerRef" autocomplete="off" disabled>
                            <option value="">店内リストを読み込み中</option>
                        </select>
                    </label>
                    <div id="tarotCustomerListStatus" class="tarot-reading-customer-status" role="status" aria-live="polite">店内リストを読み込んでいます。</div>
                </section>

                <section class="tarot-reading-panel tarot-reading-topic">
                    <div class="tarot-reading-section-head">
                        <div>
                            <div class="tarot-reading-section-title">占う内容</div>
                            <div class="tarot-reading-section-sub">スタッフ選択</div>
                        </div>
                    </div>
                    <div id="tarotTopicList" class="tarot-reading-segments" role="listbox" aria-label="占う内容"></div>
                    <div class="tarot-reading-subtopic-block">
                        <div class="tarot-reading-subtopic-label">相談の焦点</div>
                        <div id="tarotSubtopicList" class="tarot-reading-subtopics" role="listbox" aria-label="相談の焦点"></div>
                    </div>
                </section>
            </div>

            <section class="tarot-reading-panel tarot-reading-card-select">
                <div class="tarot-reading-section-head">
                    <div>
                        <div class="tarot-reading-section-title">カード選択</div>
                        <div class="tarot-reading-section-sub">実カードに合わせる</div>
                    </div>
                    <div class="tarot-reading-orientation" aria-label="カードの向き">
                        <button type="button" data-orientation="upright">正</button>
                        <button type="button" data-orientation="reversed">逆</button>
                    </div>
                </div>
                <div class="tarot-reading-spread-control">
                    <span>引き方</span>
                    <div id="tarotSpreadMode" class="tarot-reading-spread-mode" aria-label="カードの引き方">
                        <button type="button" data-spread-mode="single">1枚引き</button>
                        <button type="button" data-spread-mode="triple">3枚引き</button>
                    </div>
                </div>
                <div id="tarotSpreadSlots" class="tarot-reading-spread-slots" aria-label="3枚引きの配置" hidden></div>
                <label class="tarot-reading-search">
                    <span>検索</span>
                    <input id="tarotCardSearch" type="search" autocomplete="off" placeholder="カード名 / スート">
                </label>
                <div id="tarotDeckTabs" class="tarot-reading-tabs" aria-label="カード種別"></div>
                <div id="tarotCardGrid" class="tarot-reading-card-grid" aria-label="タロットカード一覧"></div>
            </section>

            <section class="tarot-reading-panel tarot-reading-result-panel">
                <div class="tarot-reading-section-head">
                    <div>
                        <div class="tarot-reading-section-title">鑑定結果</div>
                        <div class="tarot-reading-section-sub">お客様へ伝える鑑定書</div>
                    </div>
                    <div id="tarotMajorBadge" class="tarot-reading-major-badge" hidden>MAJOR ARCANA</div>
                </div>
                <section id="tarotWeatherStatus" class="tarot-reading-weather" aria-label="航海天候ステータス" aria-live="polite" hidden>
                    <div class="tarot-reading-weather-main">
                        <span id="tarotWeatherLevel">風向き</span>
                        <strong id="tarotWeatherTitle">カード未選択</strong>
                    </div>
                    <div class="tarot-reading-weather-meter" aria-hidden="true">
                        <span id="tarotWeatherMeter"></span>
                    </div>
                </section>
                <div class="tarot-reading-result-wrap">
                    <div id="tarotSelectedCard" class="tarot-reading-card-preview" aria-live="polite">
                        <div class="tarot-reading-card-face">
                            <span id="tarotSelectedNumber">-</span>
                            <strong id="tarotSelectedName">未選択</strong>
                            <small id="tarotSelectedMeta">カードを選択</small>
                        </div>
                    </div>
                    <div id="tarotTriplePreview" class="tarot-reading-triple-preview" aria-live="polite" hidden></div>
                    <section class="tarot-reading-staff-script" aria-live="polite">
                        <span>お客様へ伝える鑑定</span>
                        <div id="tarotStaffReadingText">カードを選択してください。</div>
                    </section>
                </div>
                <label class="tarot-reading-result-editor tarot-reading-line-preview">
                    <span>LINE送信プレビュー</span>
                    <textarea id="tarotResultText" rows="10" readonly></textarea>
                </label>
                <button id="tarotSendLine" type="button" class="tarot-reading-send">LINEへ送信</button>
            </section>
        </section>
    </main>

    <script type="module" src="/js/tarotReading.js"></script>
</body>
</html>
