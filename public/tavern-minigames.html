<body>
<main class="house" id="chooser">
  <a class="back" href="./#games">‹ ゲームタブ</a>
  <header class="mast">
    <div class="stamp" aria-hidden="true">✦</div>
    <p class="overline">PIRATES BAR TROY</p>
    <h1>酒場ミニゲーム集</h1>
    <p>スマホ1台をはさんで、ふたりで勝負。</p>
  </header>
  <fieldset class="placement">
    <legend>ふたりの座り方</legend>
    <label><input type="radio" name="layout" value="table" checked><span><b>向かい合い</b><small>縦向きで上下に</small></span></label>
    <label><input type="radio" name="layout" value="counter"><span><b>カウンター</b><small>横に置いて左右に</small></span></label>
  </fieldset>
  <div class="catalog-heading"><label for="category">種目</label><select id="category"><option value="all">すべて</option></select></div>
  <div id="games" class="games" aria-label="ゲームを選ぶ"></div>
  <noscript>プレイするには JavaScript を有効にしてください。</noscript>
</main>
<main class="arena" id="arena" data-layout="table" data-phase="idle" aria-labelledby="title" hidden>
  <button class="player a" type="button" aria-label="1P 押す（Fキー）" aria-disabled="true">
    <span class="seat">1P <span class="key">F</span><span class="wins"></span></span>
    <strong></strong><small></small><em class="say"></em>
  </button>
  <div class="deck">
    <button class="back" type="button" id="exit" aria-label="ゲーム一覧へ戻る">‹ 一覧</button>
    <div class="signal"><h1 id="title" tabindex="-1"></h1><p id="signal" role="status"></p><p id="hint"></p></div>
    <button type="button" class="start" id="start">開始</button>
    <button type="button" class="sound" id="sound" aria-pressed="true" aria-label="効果音とバイブ">♪</button>
  </div>
  <button class="player b" type="button" aria-label="2P 押す（Jキー）" aria-disabled="true">
    <span class="seat">2P <span class="key">J</span><span class="wins"></span></span>
    <strong></strong><small></small><em class="say"></em>
  </button>
</main>
</body>
</html>
