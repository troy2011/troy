<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <link rel="icon" type="image/png" href="/Sprites/PirateIcon/Icon1.png">
    <link rel="stylesheet" href="/style.css">
    <title>TROY 会計レジ</title>
</head>
<body class="troy-orders-body">
    <main class="troy-orders-shell">
        <header class="troy-orders-header">
            <div>
                <div class="troy-orders-kicker">TROY STAFF</div>
                <h1>会計レジ</h1>
            </div>
            <div class="troy-orders-header-actions">
                <div id="troyOrdersAuthName" class="troy-orders-auth-name">ログイン不要</div>
                <button id="troyOrdersSoundToggle" type="button" class="troy-orders-sound-toggle" aria-pressed="false">Sound OFF</button>
                <button id="troyOrdersRefresh" type="button" class="troy-orders-refresh">更新</button>
            </div>
        </header>

        <section class="troy-orders-summary">
            <div class="troy-orders-summary-item">
                <span>営業状態</span>
                <strong id="troyOrdersOpenState">-</strong>
            </div>
            <div class="troy-orders-summary-item">
                <span>会計待ち</span>
                <strong id="troyOrdersPendingCount">0件</strong>
            </div>
            <div class="troy-orders-summary-item">
                <span>本日売上</span>
                <strong id="troyOrdersTodaySales">¥0</strong>
            </div>
            <div class="troy-orders-summary-item">
                <span>最終更新</span>
                <strong id="troyOrdersUpdatedAt">-</strong>
            </div>
        </section>

        <section class="troy-orders-toolbar">
            <label>
                <span>並び順</span>
                <select id="troyOrdersSort">
                    <option value="oldest">伝票作成順</option>
                    <option value="newest">新しい順</option>
                    <option value="name">席/名前順</option>
                </select>
            </label>
            <div id="troyOrdersServeSummary" class="troy-orders-serve-summary">伝票 0件</div>
        </section>

        <section class="troy-orders-ticket-board">
            <div class="troy-orders-section-head">
                <div>
                    <div class="troy-orders-section-title">店内伝票</div>
                    <div class="troy-orders-section-sub">お客様ごとの伝票を開いて注文追加・会計を行います</div>
                </div>
            </div>
            <div id="troyOrdersTicketGrid" class="troy-orders-ticket-grid"></div>
            <section id="troyOrdersEmpty" class="troy-orders-empty" hidden>店内の伝票はありません。</section>
        </section>

        <section id="troyOrdersMessage" class="troy-orders-message"></section>
        <section class="troy-orders-coin-log-panel">
            <div class="troy-orders-section-head">
                <div>
                    <div class="troy-orders-section-title">チップ化ログ</div>
                    <div class="troy-orders-section-sub">チップ化したお客様の確認用</div>
                </div>
            </div>
            <div id="troyOrdersCoinLog" class="troy-orders-coin-log"></div>
        </section>
    </main>

    <div id="troyOrdersTicketModal" class="troy-orders-ticket-modal" hidden>
        <div class="troy-orders-ticket-modal-panel">
            <button id="troyOrdersTicketClose" type="button" class="troy-orders-ticket-close" aria-label="伝票を閉じる">×</button>
            <div id="troyOrdersTicketDetail" class="troy-orders-ticket-detail-wrap"></div>
        </div>
    </div>

    <div id="troyOrdersConfirmModal" class="troy-orders-confirm" hidden>
        <div class="troy-orders-confirm-panel">
            <div class="troy-orders-confirm-kicker">会計確認</div>
            <h2 id="troyOrdersConfirmName">-</h2>
            <div id="troyOrdersConfirmTotal" class="troy-orders-confirm-total">¥0</div>
            <div id="troyOrdersConfirmItems" class="troy-orders-confirm-items"></div>
            <label class="troy-orders-confirm-check">
                <input id="troyOrdersConfirmCheck" type="checkbox">
                <span>現金受け取り・チップ返却・退店処理を確認しました</span>
            </label>
            <div class="troy-orders-confirm-actions">
                <button id="troyOrdersConfirmCancel" type="button" class="is-cancel">戻る</button>
                <button id="troyOrdersConfirmSubmit" type="button" disabled>会計・退店を確定</button>
            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="loading-spinner" style="display:none;"></div>
    <div id="pointMessage" hidden></div>

    <script type="importmap">
    {
      "imports": {
        "api": "./js/api.js"
      }
    }
    </script>
    <script type="module" src="/js/troyOrders.js"></script>
</body>
</html>
